<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 WC 2026 Live | Crazy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html, body {height:100%; overflow:hidden;}
body{
  font-family:'Segoe UI',Tahoma,sans-serif;
  background:#000;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* HEADER */
.header{
width:100%;
padding:15px;
font-size:24px;
font-weight:bold;
background:linear-gradient(-45deg,#ff0000,#ffcc00,#ff3300,#ffaa00);
background-size:400% 400%;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:gradAnim 8s ease infinite;
text-shadow:0 2px 8px rgba(0,0,0,0.7);
}
@keyframes gradAnim{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}
.live-badge{
margin-top:5px;
background:#e10600;
padding:5px 15px;
border-radius:20px;
font-size:14px;
font-weight:bold;
color:#fff;
box-shadow:0 0 10px #ff0000;
}

/* TICKER */
.ticker-container{
width:100%;
overflow:hidden;
background:#111;
padding:8px 0;
border-bottom:2px solid #ffcc00;
}
.ticker{
display:flex;
gap:50px;
white-space:nowrap;
animation:scrollTicker 25s linear infinite;
}
@keyframes scrollTicker{
0%{transform:translateX(100%);}
100%{transform:translateX(-100%);}
}
.ticker span{
font-weight:bold;
color:#ffcc00;
font-size:14px;
}

/* STREAM */
.stream-container{
position:relative;
width:100%;
flex:1; /* take full available height */
background:#000;
}
.stream-container iframe{
width:100%;
height:100%;
border:none;
}

/* MATCH INFO */
.match-info-box{
width:100%;
background:#111;
color:#ffcc00;
font-weight:bold;
padding:8px 0;
text-align:center;
border-top:2px solid #ffcc00;
font-size:14px;
}

/* VIEWERS */
.viewer-box{
background:#111;
padding:8px 15px;
border-radius:20px;
margin:5px 0;
font-size:14px;
font-weight:bold;
color:#00ff99;
box-shadow:0 0 10px rgba(0,255,153,0.3);
}

/* CHAT */
.chat-container{
display:none; /* hide chat for fullscreen focus */
}
</style>
</head>

<body>

<div class="header">🏏 T20 WORLD CUP 2026 LIVE BY CRAZY</div>
<div class="live-badge">🔴 LIVE NOW</div>

<div class="ticker-container">
<div class="ticker" id="matchTicker">
<span>Loading Matches...</span>
</div>
</div>

<div class="stream-container">
<iframe id="liveFrame" src="https://tamashaweb.com/icc-mens-t20-world-cup-2026" allowfullscreen></iframe>
</div>

<div class="match-info-box">
Next Match: <span id="nextMatchTeams">Loading...</span> | Starts in: <span id="countdown">Loading...</span>
</div>

<div class="viewer-box">
👀 Live Viewers: <span id="viewerCount">0</span>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// FIREBASE INIT
const firebaseConfig={
apiKey:"AIzaSyA8tz08_fIIVq3MRT3VVTLyD35QsfLzxE0",
authDomain:"t20worldcuplivebycrazy.firebaseapp.com",
databaseURL:"https://t20worldcuplivebycrazy-default-rtdb.firebaseio.com",
projectId:"t20worldcuplivebycrazy"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

/* MATCHES WITH FLAGS */
const matches = [
  { teams: "Pakistan 🇵🇰 vs India 🇮🇳", time: "2026-02-15T14:00:00" },
  { teams: "Australia 🇦🇺 vs England 🏴", time: "2026-02-15T18:00:00" },
  { teams: "New Zealand 🇳🇿 vs South Africa 🇿🇦", time: "2026-02-16T12:00:00" }
];

/* NEXT MATCH */
function updateNextMatchCountdown() {
  const now = new Date();
  let nextMatch = matches.find(m => new Date(m.time) > now);
  if (!nextMatch) {
    document.getElementById("countdown").innerText = "No upcoming matches!";
    document.getElementById("nextMatchTeams").innerText = "-";
    return;
  }
  const diff = new Date(nextMatch.time) - now;
  const h = Math.floor(diff/1000/60/60);
  const m = Math.floor((diff/1000/60)%60);
  const s = Math.floor((diff/1000)%60);
  document.getElementById("countdown").innerText = `${h}h ${m}m ${s}s`;
  document.getElementById("nextMatchTeams").innerText = nextMatch.teams;
}
setInterval(updateNextMatchCountdown,1000);
updateNextMatchCountdown();

/* TICKER */
function updateTicker(){
  const ticker=document.getElementById("matchTicker");
  ticker.innerHTML="";
  matches.forEach(m=>{
    const now=new Date();
    const diff=new Date(m.time)-now;
    const h=Math.floor(diff/1000/60/60);
    const mnt=Math.floor((diff/1000/60)%60);
    const s=Math.floor((diff/1000)%60);
    const span=document.createElement("span");
    span.innerText=`${m.teams} | Starts in: ${h}h ${mnt}m ${s}s`;
    ticker.appendChild(span);
  });
}
setInterval(updateTicker,1000);
updateTicker();

/* VIEWERS */
const viewerRef=db.ref("viewers");
const myViewer=viewerRef.push();
myViewer.set(true);
myViewer.onDisconnect().remove();
setInterval(()=>{
viewerRef.once("value",snap=>{
document.getElementById("viewerCount").innerText=snap.numChildren();
});
},5000);

/* FULLSCREEN */
function goFullScreen(){
let iframe=document.getElementById("liveFrame");
if(iframe.requestFullscreen){iframe.requestFullscreen();}
else if(iframe.webkitRequestFullscreen){iframe.webkitRequestFullscreen();}
else if(iframe.msRequestFullscreen){iframe.msRequestFullscreen();}
}
document.addEventListener('DOMContentLoaded', ()=>{goFullScreen();});
</script>

</body>
</html>
