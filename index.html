<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 WC 2026 Live | Crazy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

.stream-container{
  position:relative;
  width:100%;
  height:100%;
}

.stream-container iframe{
  position:absolute;
  top:-60px; /* Hide Tamasha header */
  left:0;
  width:100%;
  height:calc(100% + 60px); /* Extra height to hide header */
  border:none;
}
</style>
</head>
<body>

<div class="stream-container">
<iframe src="https://tamashaweb.com/icc-mens-t20-world-cup-2026" allowfullscreen></iframe>
</div>

<script>
// Auto fullscreen in browser
document.addEventListener('DOMContentLoaded', () => {
  const iframe = document.querySelector('iframe');
  if(iframe.requestFullscreen){
    iframe.requestFullscreen();
  } else if(iframe.webkitRequestFullscreen){
    iframe.webkitRequestFullscreen();
  } else if(iframe.msRequestFullscreen){
    iframe.msRequestFullscreen();
  }
});
</script>

</body>
</html>
