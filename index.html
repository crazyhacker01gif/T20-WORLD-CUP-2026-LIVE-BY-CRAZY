<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T20 WC 2026 Live | Crazy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Segoe UI',Tahoma,sans-serif;
  background:linear-gradient(135deg,#0d0d0d,#1a1a1a);
  color:#fff;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* HEADER */
.header{
  width:100%;
  padding:25px;
  font-size:28px;
  font-weight:bold;
  background:linear-gradient(-45deg,#ff0000,#ffcc00,#ff3300,#ffaa00);
  background-size:400% 400%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:gradAnim 8s ease infinite;
}
@keyframes gradAnim{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.live-badge{
margin-top:10px;
background:#e10600;
padding:6px 15px;
border-radius:20px;
font-size:14px;
font-weight:bold;
}

/* STREAM */
.stream-container{
position:relative;
width:95%;
max-width:1400px;
padding-bottom:75%;
margin:25px auto;
border-radius:20px;
overflow:hidden;
background:#000;
box-shadow:0 15px 40px rgba(0,0,0,0.7);
}
.stream-container iframe{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
border:none;
}

/* LOADER */
.loader{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
border:6px solid #f3f3f3;
border-top:6px solid #ffcc00;
border-radius:50%;
width:60px;
height:60px;
animation:spin 1s linear infinite;
z-index:10;
}
@keyframes spin{
0%{transform:translate(-50%,-50%) rotate(0deg);}
100%{transform:translate(-50%,-50%) rotate(360deg);}
}

/* SCOREBOARD */
.scoreboard-container{
width:95%;
max-width:1200px;
margin:25px auto;
border-radius:20px;
overflow:hidden;
background:#111;
box-shadow:0 15px 35px rgba(0,0,0,0.7);
}
.scoreboard-header{
padding:15px;
font-weight:bold;
font-size:18px;
background:#ffcc00;
color:#000;
}
.scoreboard-container iframe{
width:100%;
height:450px;
border:none;
}

/* BUTTON */
.btn{
padding:16px 35px;
background:linear-gradient(to right,#ffcc00,#ff9900);
border:none;
font-size:17px;
font-weight:bold;
border-radius:30px;
cursor:pointer;
margin:15px;
transition:0.3s;
}
.btn:hover{transform:scale(1.05);}

/* VIEWERS */
.viewer-box{
background:#111;
padding:12px 25px;
border-radius:30px;
margin:20px 0;
font-size:18px;
font-weight:bold;
color:#00ff99;
}

/* CHAT */
.chat-container{
width:90%;
max-width:1000px;
background:#111;
border-radius:20px;
padding:20px;
margin-bottom:30px;
}
.chat-box{
height:300px;
overflow-y:auto;
background:#000;
padding:10px;
border-radius:12px;
text-align:left;
margin-bottom:10px;
font-size:14px;
}
.chat-input{display:flex;gap:5px;margin-bottom:8px;}
.chat-input input{
padding:12px;
border:none;
border-radius:20px;
flex:1;
}
.chat-input button{
padding:12px 20px;
border:none;
background:#25d366;
color:#fff;
border-radius:20px;
cursor:pointer;
}

/* WHATSAPP */
.whatsapp{
display:block;
background:#25d366;
padding:14px 20px;
border-radius:50px;
color:#fff;
font-weight:bold;
text-decoration:none;
margin:10px auto 40px auto;
}
</style>
</head>

<body>

<div class="header">🏏 T20 WORLD CUP 2026 LIVE BY CRAZY</div>
<div class="live-badge">🔴 LIVE NOW</div>

<!-- STREAM -->
<div class="stream-container">
<div class="loader" id="loader"></div>
<iframe id="liveFrame"
src="https://tamashaweb.com/icc-mens-t20-world-cup-2026"
allowfullscreen
onload="document.getElementById('loader').style.display='none'">
</iframe>
</div>

<button class="btn" onclick="goFullScreen()">🔥 Watch Full Screen</button>

<!-- MATCH SCHEDULE -->
<div class="match-info-box" style="margin:20px auto;background:#111;border-radius:15px;padding:15px;max-width:1200px;font-size:16px;box-shadow:0 8px 25px rgba(0,0,0,0.7);">
Upcoming Match: <span id="nextMatchTeams">Loading...</span> | Starts in: <span id="countdown">Loading...</span>
</div>

<div class="viewer-box">
👀 Live Viewers: <span id="viewerCount">0</span>
</div>

<!-- CHAT -->
<div class="chat-container">
<h2 style="color:#ffcc00;">💬 Live Chat</h2>

<div class="chat-box" id="chatBox"></div>

<!-- USERNAME SET -->
<div class="chat-input">
<input type="text" id="usernameInput" placeholder="Set Your Name">
<button onclick="setUsername()">Set</button>
</div>

<!-- MESSAGE SEND -->
<div class="chat-input">
<input type="text" id="chatInput" placeholder="Type message...">
<button onclick="sendMessage()">Send</button>
</div>

</div>

<a class="whatsapp"
href="https://whatsapp.com/channel/0029Vb5l43dK0IBsMnYMGo2d"
target="_blank">
Join WhatsApp Channel
</a>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// FIREBASE INIT
const firebaseConfig={
apiKey:"AIzaSyA8tz08_fIIVq3MRT3VVTLyD35QsfLzxE0",
authDomain:"t20worldcuplivebycrazy.firebaseapp.com",
databaseURL:"https://t20worldcuplivebycrazy-default-rtdb.firebaseio.com",
projectId:"t20worldcuplivebycrazy"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

/* MATCH SCHEDULE */
const matches = [
  { teams: "Pakistan 🇵🇰 vs India 🇮🇳", time: "2026-02-15T14:00:00" },
  { teams: "Australia 🇦🇺 vs England 🏴", time: "2026-02-15T18:00:00" },
  { teams: "New Zealand 🇳🇿 vs South Africa 🇿🇦", time: "2026-02-16T12:00:00" }
];

function updateNextMatchCountdown() {
  const now = new Date();
  let nextMatch = matches.find(m => new Date(m.time) > now);
  if (!nextMatch) {
    document.getElementById("countdown").innerText = "No upcoming matches!";
    document.getElementById("nextMatchTeams").innerText = "-";
    return;
  }
  const diff = new Date(nextMatch.time) - now;
  const h = Math.floor(diff/1000/60/60);
  const m = Math.floor((diff/1000/60)%60);
  const s = Math.floor((diff/1000)%60);
  document.getElementById("countdown").innerText = `${h}h ${m}m ${s}s`;
  document.getElementById("nextMatchTeams").innerText = nextMatch.teams;
}
setInterval(updateNextMatchCountdown,1000);
updateNextMatchCountdown();

/* USERNAME SAVE */
let currentUser = localStorage.getItem("username") || "Guest";
function setUsername(){
  const name=document.getElementById("usernameInput").value.trim();
  if(name==="")return;
  currentUser=name;
  localStorage.setItem("username",name);
  alert("Username Set: "+name);
}

/* VIEWERS */
const viewerRef=db.ref("viewers");
const myViewer=viewerRef.push();
myViewer.set(true);
myViewer.onDisconnect().remove();
setInterval(()=>{
viewerRef.once("value",snap=>{
document.getElementById("viewerCount").innerText=snap.numChildren();
});
},5000);

/* SEND MESSAGE */
function sendMessage(){
let msg=document.getElementById("chatInput").value.trim();
if(msg==="")return;

let newMsg=db.ref("chat").push();
newMsg.set({
user:currentUser,
text:msg,
timestamp:Date.now()
});

document.getElementById("chatInput").value="";
}

/* RECEIVE + AUTO DELETE 5 MIN */
db.ref("chat").on("child_added",snap=>{
let data=snap.val(),key=snap.key;
let now=Date.now();
if(now-data.timestamp>300000){
db.ref("chat/"+key).remove();
return;
}
let div=document.createElement("div");
div.innerHTML="<b>"+data.user+":</b> "+data.text;
document.getElementById("chatBox").appendChild(div);
div.scrollIntoView({behavior:"smooth"});
setTimeout(()=>{db.ref("chat/"+key).remove();},300000-(now-data.timestamp));
});

/* FULLSCREEN */
function goFullScreen(){
let iframe=document.getElementById("liveFrame");
if(iframe.requestFullscreen){iframe.requestFullscreen();}
else if(iframe.webkitRequestFullscreen){iframe.webkitRequestFullscreen();}
else if(iframe.msRequestFullscreen){iframe.msRequestFullscreen();}
}
</script>

</body>
</html>
